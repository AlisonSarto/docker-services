services:

  mysql-metabase:
    image: mysql:8.0
    container_name: mysql-metabase
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./.db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: ${MYSQL_DATABASE}
      MB_DB_PORT: 3306
      MB_DB_USER: ${MYSQL_USER}
      MB_DB_PASS: ${MYSQL_PASSWORD}
      MB_DB_HOST: mysql-metabase
      MB_DB_CONNECTION_URI: "jdbc:mysql://mysql-metabase:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

    depends_on:
      mysql-metabase:
        condition: service_healthy